{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Смена пароля - ApexSelect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-key me-2"></i>Смена пароля</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="alert alert-info mt-3">
                            <i class="bi bi-info-circle me-2"></i>
                            После смены пароля вам потребуется войти в систему заново.
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'my_profile' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Назад
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle me-1"></i>Сменить пароль
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
