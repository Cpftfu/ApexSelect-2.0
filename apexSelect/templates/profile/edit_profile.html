{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Редактирование профиля - ApexSelect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Редактирование профиля</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'my_profile' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Назад
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i>Сохранить изменения
                            </button>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <h6 class="mb-3">Безопасность</h6>
                        <a href="{% url 'change_password' %}" class="btn btn-outline-warning">
                            <i class="bi bi-key me-1"></i>Сменить пароль
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
